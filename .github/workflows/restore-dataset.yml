name: Restore dataset

on:
  push:
    paths:
      - ".github/workflows/restore-dataset.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download UCI Bank Marketing dataset
        run: |
          curl -L "https://archive.ics.uci.edu/static/public/222/bank+marketing.zip" -o /tmp/bank.zip
          unzip -o /tmp/bank.zip -d /tmp/bank
          unzip -o /tmp/bank/bank-additional.zip -d /tmp/bank/additional
          cp /tmp/bank/additional/bank-additional/bank-additional-full.csv dataset/bank-additional-full.csv
          test -s dataset/bank-additional-full.csv
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/bank-additional-full.csv
          git diff --cached --quiet || git commit -m "Restore Task 3 dataset"
          git push
